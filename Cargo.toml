[package]
name = "melodias-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "TUI to generate 8-bit thumbnails and original chiptune tracks for a YouTube channel, using local models"
license = "MIT"

[[bin]]
name = "melodias"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
ratatui = "0.29"
midly = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
sha2 = "0.10"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
