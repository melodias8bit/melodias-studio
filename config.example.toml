# Copy this file to ~/.config/melodias-studio/config.toml and uncomment what
# you need. Environment variables win over this file, and every value has a
# built-in default. All fields are optional.

# --- Endpoints -------------------------------------------------------------
# Any OpenAI-compatible chat server for the image prompt.
# llm_url = "http://127.0.0.1:8080"
# llm_model = "local"

# Any stable-diffusion.cpp server (OpenAI images API).
# sd_url = "http://127.0.0.1:1234"

# Any audio.cpp server with the ACE-Step family.
# audio_url = "http://127.0.0.1:8090"
# audio_model = "ace-step"

# --- Host and lifecycle ----------------------------------------------------
# Empty means the services run locally and the reference stays on this machine.
# ssh_host = "root@192.168.88.38"
# remote_ref_dir = "/models/ref"

# Commands are run over SSH between stages. Set them to "" to manage the
# servers yourself. Without SSH, the same commands run on this machine.
# llm_start_cmd = "/home/ubuntu/bin/serve-llm.sh start"
# llm_stop_cmd = "/home/ubuntu/bin/serve-llm.sh stop"
# sd_start_cmd = "/home/ubuntu/bin/serve-sd.sh start"
# sd_stop_cmd = "/home/ubuntu/bin/serve-sd.sh stop"
# audio_start_cmd = "/home/ubuntu/bin/serve-audio.sh start"
# audio_stop_cmd = "/home/ubuntu/bin/serve-audio.sh stop"

# --- Content ---------------------------------------------------------------
# audio_style = "8-bit chiptune"
# Run-specific extras appended verbatim to the music prompt (BPM, instruments).
# Empty by default; the template already carries the arrangement detail.
# audio_detail = "117 BPM in 4/4, electric lead guitars over orchestra"
# Optional reference for ACE-Step: a ChipForge render, a Wario Synth export
# or a MIDI-driven chip bounce. Replaces a window of the source video.
# audio_reference = "/path/to/loop.wav"
# image_style = "8-bit pixel art"
# Model labels for the YouTube description (tool + model), not request fields.
# image_model = "MOSS-Image-SFT-UD-Q4_K_XL"
# creative_model = "Qwen3-4B-Instruct-2507"
# image_negative_prompt = "glowing eyes, neon eyes, empty eyes, oversaturated eyes, text, watermark, signature"
# gpu_label = "local models"
# duration_sec = 210
# steps = 32
# guidance = 5.0
# sampler = "heun"
# width = 1280
# height = 720
# video_width = 1920
# video_height = 1080
# video_renderer = "remotion"   # remotion | ffmpeg; ffmpeg is explicit only
# video_particles = "both"      # both | bokeh | sparks
# video_project = "video"
# image_steps = 20
# image_seed = 42
# Optional reference library. It is a local folder or a mounted share; the app
# never mounts it or copies it into the repository. Subfolders are concepts.
# image_references = "/path/to/reference-thumbnails"
# image_reference_count = 3
# image_reference_concept = "battle"
# candidates = 3
# Deterministic retry rounds. 2 by default; the image budget caps at 2 and the
# audio budget at 1. Set 0 to disable the loop.
# score_rounds = 2
# audio_draft_sec = 60
# audio_draft_steps = 16
# audio_draft_sampler = "euler"
# reference_sec = 60
# Detailed steering text: voices stay out and the production stays tight and
# finished. Sent on every audio request, reference or not.
# audio_negative_prompt = "vocals, singing, rap, spoken words, choir, lyrics, humming, vocal chops, voice, acoustic folk, ambient music, lo-fi production, trap beats, hip hop drums, EDM drops, dubstep, generic pop structure, repetitive four-chord pop progression, weak percussion, muddy bass, distorted muddy guitars, excessive reverb, harsh clipping, synthetic cheap-sounding instruments, monotonous melodies, overly slow tempo, excessive silence, unfinished arrangement, abrupt ending, poor mixing, low fidelity, amateur production"

# --- Master ----------------------------------------------------------------
# fade_in_sec = 1.5
# fade_out_sec = 3.0
# loudness_lufs = -15.0

# --- Judge (optional) ------------------------------------------------------
# The judge runs when a provider key is present. The key goes in the
# environment of the process that runs melodias:
#   export OPENCODE_API_KEY="..."    (OpenCode Go, default backend)
#   export OPENROUTER_API_KEY="sk-or-..."   (alternative backend)
# or here, in this user-only file (never commit it):
# opencode_api_key = ""
# openrouter_api_key = ""
# judge_enabled = true
# judge_provider = "auto"        # opencode | openrouter | auto
# judge_model = "gemini-4-argon" # OpenCode Go, native Gemini API
# judge_omni_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
# judge_reasoner_model = "nvidia/nemotron-3-ultra-550b-a55b:free"
# judge_image_px = 768
# judge_audio_sec = 15
# judge_timeout_sec = 300

# --- Output ----------------------------------------------------------------
# out_dir = "output"
# The local SQLite history. Defaults to history.db next to this file.
# db_path = "/home/you/.config/melodias-studio/history.db"
